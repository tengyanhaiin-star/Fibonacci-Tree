<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0f">
<title>LED 像素屏样机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400&family=Noto+Sans+SC:wght@400&family=Noto+Sans+JP:wght@400&family=Noto+Sans+KR:wght@400&family=Noto+Sans+Arabic:wght@400&family=Space+Grotesk:wght@300;400;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Unifont';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/unifont@5.2.5/files/unifont-latin-400-normal.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0d0f;
    --surface:  #131318;
    --border:   #2a2a35;
    --accent:   #c8ff00;
    --dim:      #555566;
    --text:     #e8e8f0;
    --subtext:  #888899;
    --bezel:    #1c1c24;
    --bezel-hi: #2e2e3a;
    --safe-top:    env(safe-area-inset-top, 0px);
    --safe-right:  env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left:   env(safe-area-inset-left, 0px);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding:
      calc(48px + var(--safe-top))
      calc(24px + var(--safe-right))
      calc(80px + var(--safe-bottom))
      calc(24px + var(--safe-left));
    -webkit-text-size-adjust: 100%;
  }

  /* ── Header ── */
  header {
    width: 100%;
    max-width: 780px;
    margin-bottom: 48px;
  }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 {
    font-size: clamp(26px, 4vw, 40px);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    font-size: 13px;
    color: var(--subtext);
    font-weight: 300;
  }

  /* ── Main layout ── */
  .main {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* ── Device card ── */
  .device-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
  }

  .stage {
    background: #060608;
    padding: 52px 24px 44px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 200px;
    overflow: hidden;
  }

  .device-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: calc(var(--canvas-w, 384px) + 72px);
  }

  /* Ambient glow — updates dynamically */
  .stage-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 50% 35% at 50% 50%, rgba(200,255,0,0.06) 0%, transparent 70%);
    pointer-events: none;
    transition: background 0.6s ease;
  }

  /* Physical housing */
  .housing {
    background: linear-gradient(160deg, var(--bezel-hi) 0%, var(--bezel) 60%, #111118 100%);
    border: 1.5px solid #383848;
    border-radius: 7px;
    padding: 9px 18px 10px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 2px 8px rgba(0,0,0,0.8),
      0 12px 40px rgba(0,0,0,0.7);
    position: relative;
    width: 100%;
    max-width: calc(var(--canvas-w, 384px) + 56px);
    box-sizing: border-box;
  }
  .housing::before, .housing::after {
    content: '';
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #0a0a10;
    border: 1px solid #333340;
  }
  .housing::before { left: 5px; }
  .housing::after  { right: 5px; }

  .screen-bezel {
    background: #03030a;
    border: 1px solid #1e1e2c;
    border-radius: 3px;
    padding: 5px;
  }

  .screen-inner {
    position: relative;
    width: 100%;
    max-width: var(--canvas-w, 384px);
    margin: 0 auto;
  }

  /* The canvas — pixelated upscale */
  #ledCanvas {
    display: block;
    width: 100%;
    max-width: var(--canvas-w, 384px);
    height: auto;
    aspect-ratio: var(--canvas-ar, 96 / 16);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 1px;
  }

  /* LED dot-matrix overlay */
  .dot-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    border-radius: 1px;
    background-image:
      repeating-linear-gradient(0deg,  transparent, transparent 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px);
  }

  .stand      { width: 3px; height: 22px; background: linear-gradient(to bottom, #282834, #181820); border-left: 1px solid #303040; border-right: 1px solid #111118; }
  .stand-base { width: 60px; height: 6px; background: linear-gradient(to bottom, #232330, #161620); border-radius: 0 0 4px 4px; border: 1px solid #2c2c3a; border-top: none; }

  /* ── Controls panel ── */
  .controls {
    padding: 28px 32px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    border-top: 1px solid var(--border);
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }

  input[type="text"] {
    background: #0d0d14;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  input[type="text"]::placeholder {
    color: var(--dim);
  }

  /* Effects & speed row */
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row .control-group { flex: 1; min-width: 160px; }

  .select-wrap {
    position: relative;
  }
  select {
    appearance: none;
    background: #0d0d14;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    padding: 10px 36px 10px 14px;
    outline: none;
    width: 100%;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  select:focus { border-color: var(--accent); }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--dim);
    pointer-events: none;
    font-size: 12px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    margin-top: 8px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(200,255,0,0.4);
  }
  .range-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    margin-top: 4px;
  }

  /* Color presets */
  .preset-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .preset-btn {
    border: 1.5px solid transparent;
    border-radius: 6px;
    padding: 5px 12px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: border-color 0.15s, transform 0.1s;
    background: #0d0d14;
    color: var(--text);
  }
  .preset-btn:hover { transform: translateY(-1px); }
  .preset-btn.active { border-color: var(--accent); }

  .color-picker-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }
  .color-picker-row[hidden],
  .tolerance-row[hidden] { display: none; }

  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #0d0d14;
    cursor: pointer;
    padding: 4px;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 4px;
  }
  input[type="color"]::-moz-color-swatch {
    border: none;
    border-radius: 4px;
  }

  .color-hex {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--subtext);
    letter-spacing: 0.08em;
  }

  /* Font language hint */
  .font-hint {
    font-size: 11px;
    color: var(--subtext);
    padding: 10px 14px;
    background: rgba(200,255,0,0.04);
    border: 1px solid rgba(200,255,0,0.1);
    border-radius: 6px;
    line-height: 1.6;
  }
  .font-hint strong { color: var(--accent); font-weight: 400; }

  /* ── Export ── */
  .export-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .export-btn {
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: 8px;
    padding: 11px 24px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .export-btn:hover  { opacity: 0.88; transform: translateY(-1px); }
  .export-btn:active { transform: translateY(0); }
  .export-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .export-btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .export-btn-secondary:hover { background: rgba(200,255,0,0.08); opacity: 1; }

  .export-status {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--subtext);
    letter-spacing: 0.06em;
  }
  .export-status.ok  { color: var(--accent); }
  .export-status.err { color: #ff6060; }

  .export-fps {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--subtext);
    letter-spacing: 0.04em;
  }
  .export-fps select {
    padding: 8px 28px 8px 10px;
    font-size: 12px;
    min-width: 88px;
  }

  /* ── Footer ── */
  footer {
    margin-top: 56px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--dim);
    text-align: center;
    padding: 0 8px;
  }

  /* ── iPhone / narrow mobile ── */
  @media (max-width: 480px) {
    body {
      padding:
        calc(20px + var(--safe-top))
        calc(12px + var(--safe-right))
        calc(40px + var(--safe-bottom))
        calc(12px + var(--safe-left));
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(22px, 7vw, 32px);
    }

    .subtitle {
      font-size: 12px;
      line-height: 1.55;
    }

    .main {
      gap: 20px;
    }

    .device-card {
      border-radius: 14px;
    }

    .stage {
      padding: 24px 8px 20px;
      min-height: 120px;
    }

    .housing {
      padding: 7px 10px 8px;
      border-radius: 6px;
    }

    .controls {
      padding: 18px 14px 22px;
      gap: 16px;
    }

    .row {
      gap: 12px;
    }

    .row .control-group {
      flex: 1 1 100%;
      min-width: 0;
    }

    select {
      font-size: 16px;
      padding-top: 12px;
      padding-bottom: 12px;
    }

    input[type="text"] {
      font-size: 16px;
    }

    .preset-btn {
      padding: 8px 10px;
      min-height: 36px;
    }

    .export-row {
      gap: 10px;
    }

    .export-fps {
      width: 100%;
    }

    .export-btn {
      min-height: 44px;
      padding: 12px 18px;
    }

    footer {
      margin-top: 28px;
      font-size: 9px;
      letter-spacing: 0.06em;
    }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
</head>
<body>

<header>
  <p class="eyebrow">Product Mockup · LED Pixel Display</p>
  <h1>软屏样机<br><span>自定义文字预览</span></h1>
  <p class="subtitle">96×16 / 192×32 px · 4× 放大 · Unifont / Noto Sans · 纯色容差算法 · 支持多语言</p>
</header>

<div class="main">

  <div class="device-card">
    <!-- Stage -->
    <div class="stage">
      <div class="stage-glow" id="stageGlow"></div>
      <div class="device-stack">
        <div class="housing">
          <div class="screen-bezel">
            <div class="screen-inner">
              <canvas id="ledCanvas" width="96" height="16"></canvas>
              <div class="dot-overlay" id="dotOverlay"></div>
            </div>
          </div>
        </div>
        <div class="stand"></div>
        <div class="stand-base"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">

      <div class="control-group">
        <label>第一行文字</label>
        <input type="text" id="textInput" value="欢迎光临" placeholder="输入第一行文字…" maxlength="40" spellcheck="false">
      </div>
      <div class="control-group">
        <label>第二行文字 <span style="color:var(--dim);font-size:9px;letter-spacing:0.06em;">留空则单行居中显示</span></label>
        <input type="text" id="textInput2" value="" placeholder="输入第二行文字（可留空）…" maxlength="40" spellcheck="false">
      </div>

      <div class="row">
        <div class="control-group">
          <label>屏幕分辨率</label>
          <div class="select-wrap">
            <select id="resSelect">
              <option value="96x16" selected>96 × 16 px（标准）</option>
              <option value="192x32">192 × 32 px（大屏）</option>
            </select>
          </div>
        </div>
        <div class="control-group">
          <label>动画特效</label>
          <div class="select-wrap">
            <select id="effectSelect">
              <option value="rainbow_wave" selected>彩虹波浪</option>
              <option value="scroll">横向滚动</option>
              <option value="wobble">摇摆</option>
              <option value="pulse">彩虹流动</option>
              <option value="typewriter">打字机</option>
              <option value="blink">闪烁</option>
              <option value="slide">滑入停留</option>
              <option value="scan">扫描高亮</option>
              <option value="static">静态彩虹</option>
            </select>
          </div>
        </div>
      <div class="row">
        <div class="control-group">
          <label>显示字体</label>
          <div class="select-wrap">
            <select id="fontSelect">
              <option value="unifont" selected>GNU Unifont · 16×16 像素</option>
              <option value="noto-auto">Noto Sans · 自动检测</option>
              <option value="noto-sc">Noto Sans SC · 中文</option>
              <option value="noto-jp">Noto Sans JP · 日文</option>
              <option value="noto-kr">Noto Sans KR · 韩文</option>
              <option value="noto-latin">Noto Sans · 拉丁 / 西里尔</option>
              <option value="noto-arabic">Noto Sans Arabic · 阿拉伯文</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="control-group">
          <label>动画速度 <span id="speedLabel" style="color:var(--text);margin-left:8px;">×1.0</span></label>
          <input type="range" id="speedRange" min="1" max="5" step="1" value="3">
          <div class="range-labels"><span>慢</span><span>快</span></div>
        </div>
        <div class="control-group">
          <label>字体大小 <span id="sizeLabel" style="color:var(--text);margin-left:8px;">16 px</span></label>
          <input type="range" id="sizeRange" min="8" max="16" step="8" value="16">
          <div class="range-labels"><span>小</span><span>大</span></div>
        </div>
      </div>

      <div class="control-group">
        <label>颜色方案</label>
        <div class="preset-row" id="presetRow">
          <button class="preset-btn active" data-preset="rainbow" style="border-image: linear-gradient(90deg,#f55,#fa0,#ff0,#0d0,#08f,#a0f) 1;">🌈 彩虹</button>
          <button class="preset-btn" data-preset="fire" style="color:#ff8040;">🔥 火焰</button>
          <button class="preset-btn" data-preset="ice" style="color:#60d0ff;">❄ 冰晶</button>
          <button class="preset-btn" data-preset="gold" style="color:#ffd060;">✦ 金色</button>
          <button class="preset-btn" data-preset="neon" style="color:#40ffb0;">⚡ 霓虹</button>
          <button class="preset-btn" data-preset="solid" style="color:#c8ff00;">■ 纯色</button>
        </div>
        <div class="color-picker-row" id="colorPickerRow" hidden>
          <input type="color" id="solidColorInput" value="#c8ff00" title="选择颜色">
          <span class="color-hex" id="solidColorHex">#C8FF00</span>
        </div>
        <div class="control-group tolerance-row" id="toleranceRow" hidden style="margin-top:12px;">
          <label>颜色容差 <span id="toleranceLabel" style="color:var(--text);margin-left:8px;">100</span></label>
          <input type="range" id="toleranceRange" min="0" max="200" step="1" value="100">
          <div class="range-labels"><span>严格</span><span>宽松</span></div>
        </div>
      </div>

      <div class="font-hint">
        <strong>字体说明：</strong><strong>Unifont</strong> 为 16×16 点阵字体，边缘清晰；<strong>Noto Sans</strong> 为平滑矢量字体，显示更美观。纯色模式下可调颜色容差（默认 100），值越大保留像素越多。
      </div>

      <div class="export-row">
        <div class="export-fps">
          <label for="gifFpsSelect">GIF 帧率</label>
          <div class="select-wrap">
            <select id="gifFpsSelect">
              <option value="30" selected>30 fps</option>
              <option value="60">60 fps</option>
            </select>
          </div>
        </div>
        <button class="export-btn" id="exportBtn">⬇ 导出 GIF</button>
        <button class="export-btn export-btn-secondary" id="exportPngBtn" disabled title="需选择静态彩虹特效">⬇ 导出 PNG</button>
        <div class="export-status" id="exportStatus"></div>
      </div>

    </div>
  </div>

</div>

<footer>96 × 16 LED PIXEL DISPLAY SIMULATOR · SCALE 1:4</footer>

<script>
// ── Font families ─────────────────────────────────────────
const UNIFONT = "'Unifont', monospace";

const NOTO_FONT_MAP = {
  sc:     "'Noto Sans SC', sans-serif",
  jp:     "'Noto Sans JP', sans-serif",
  kr:     "'Noto Sans KR', sans-serif",
  latin:  "'Noto Sans', sans-serif",
  arabic: "'Noto Sans Arabic', sans-serif",
};

function detectNotoFont(text) {
  if (/[\u4e00-\u9fff\u3400-\u4dbf]/.test(text)) return 'sc';
  if (/[\u3040-\u30ff\u31f0-\u31ff]/.test(text)) return 'jp';
  if (/[\uac00-\ud7af\u1100-\u11ff]/.test(text)) return 'kr';
  if (/[\u0600-\u06ff\u0750-\u077f]/.test(text)) return 'arabic';
  return 'latin';
}

function isUnifontSelected() {
  return document.getElementById('fontSelect').value === 'unifont';
}

function getFontFamily() {
  const sel = document.getElementById('fontSelect').value;
  if (sel === 'unifont') return UNIFONT;
  if (sel === 'noto-auto') {
    const text = document.getElementById('textInput').value + document.getElementById('textInput2').value;
    return NOTO_FONT_MAP[detectNotoFont(text)];
  }
  const key = sel.replace('noto-', '');
  return NOTO_FONT_MAP[key] || NOTO_FONT_MAP.latin;
}

function getFontSize() {
  return parseInt(document.getElementById('sizeRange').value);
}

function getFont() {
  return `normal ${getFontSize()}px ${getFontFamily()}`;
}

// ── Color presets ─────────────────────────────────────────
const PRESETS = {
  rainbow: [[255,50,50],[255,140,0],[255,220,0],[50,220,50],[50,180,255],[160,80,255]],
  fire:    [[255,60,0],[255,120,0],[255,200,0],[255,80,0],[200,30,0]],
  ice:     [[100,220,255],[150,240,255],[200,255,255],[80,180,255],[160,210,255]],
  gold:    [[255,200,0],[255,230,80],[255,170,0],[255,240,120],[200,140,0]],
  neon:    [[0,255,160],[0,220,255],[120,255,0],[0,180,255],[80,255,200]],
};
let currentPreset = 'rainbow';
let solidColor = '#c8ff00';

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function getActiveColors() {
  if (currentPreset === 'solid') {
    const rgb = hexToRgb(solidColor);
    return [rgb, rgb, rgb];
  }
  return PRESETS[currentPreset] || PRESETS.rainbow;
}

function updateColorPickerVisibility() {
  const show = currentPreset === 'solid';
  document.getElementById('colorPickerRow').hidden = !show;
}

function updateSolidColorHex() {
  document.getElementById('solidColorHex').textContent = solidColor.toUpperCase();
}

// ── Solid mode: hard-edge pixel quantization ─────────────
const BG_RGB = [10, 10, 15];
const BG_LUM_THRESHOLD = 28;

function getSolidColorTolerance() {
  const el = document.getElementById('toleranceRange');
  return el ? parseInt(el.value, 10) : 100;
}

function isSolidMode() {
  return currentPreset === 'solid';
}

function getSolidRgb() {
  return hexToRgb(solidColor);
}

function solidFillStyle() {
  const [r, g, b] = getSolidRgb();
  return `rgb(${r},${g},${b})`;
}

function isSolidForegroundPixel(r, g, b) {
  const [sr, sg, sb] = getSolidRgb();
  const [br, bg, bb] = BG_RGB;
  const maxDiff = Math.max(Math.abs(r - sr), Math.abs(g - sg), Math.abs(b - sb));
  if (maxDiff > getSolidColorTolerance()) return false;
  const dSolid = (r - sr) ** 2 + (g - sg) ** 2 + (b - sb) ** 2;
  const dBg = (r - br) ** 2 + (g - bg) ** 2 + (b - bb) ** 2;
  return dSolid < dBg;
}

function applySolidQuantize(context, w = W, h = H) {
  const [sr, sg, sb] = getSolidRgb();
  const [br, bg, bb] = BG_RGB;
  const img = context.getImageData(0, 0, w, h);
  const d = img.data;
  for (let p = 0; p < d.length; p += 4) {
    const r = d[p], g = d[p + 1], b = d[p + 2];
    if (isSolidForegroundPixel(r, g, b)) {
      d[p] = sr; d[p + 1] = sg; d[p + 2] = sb; d[p + 3] = 255;
    } else {
      d[p] = br; d[p + 1] = bg; d[p + 2] = bb; d[p + 3] = 255;
    }
  }
  context.putImageData(img, 0, 0);
}

function setContextFill(context, x, totalW, colors, phase) {
  if (isSolidMode()) {
    context.fillStyle = solidFillStyle();
  } else {
    context.fillStyle = makeRainbowGradientOn(context, x, totalW, colors, phase);
  }
}

function makeRainbowGradientOn(context, x, totalW, colors, phase) {
  const grad = context.createLinearGradient(x, 0, x + totalW, 0);
  const n = colors.length;
  for (let i = 0; i <= n; i++) {
    const p = i / n;
    const [r, g, b] = lerpColor(colors, (p + phase) % 1);
    grad.addColorStop(p, `rgb(${r},${g},${b})`);
  }
  return grad;
}

function pxFillText(context, text, x, y) {
  const snap = isSolidMode() || isUnifontSelected();
  context.fillText(text, snap ? Math.round(x) : x, snap ? Math.round(y) : y);
}

function updateSolidDisplayMode() {
  const overlay = document.getElementById('dotOverlay');
  if (overlay) overlay.hidden = isSolidMode();
  updateColorPickerVisibility();
  updateToleranceVisibility();
  updateExportControls();
}

function canExportStaticPNG() {
  return document.getElementById('effectSelect').value === 'static';
}

function isSolidStaticMode() {
  return isSolidMode() && canExportStaticPNG();
}

function updateToleranceVisibility() {
  const row = document.getElementById('toleranceRow');
  if (row) row.hidden = !isSolidMode();
}

function updateExportControls() {
  const pngBtn = document.getElementById('exportPngBtn');
  if (!pngBtn) return;
  const ok = canExportStaticPNG();
  pngBtn.disabled = !ok;
  pngBtn.title = ok ? `导出 ${W}×${H} 静态 PNG` : '需选择静态彩虹特效';
}

// ── Canvas setup ──────────────────────────────────────────
const canvas = document.getElementById('ledCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Mutable resolution
let W = 96, H = 16;

const RESOLUTIONS = {
  '96x16':  { w: 96,  h: 16,  scale: 4, defaultSize: 16, sizeMin: 8, sizeMax: 16, sizeStep: 8 },
  '192x32': { w: 192, h: 32,  scale: 2, defaultSize: 16, sizeMin: 8, sizeMax: 32, sizeStep: 8 },
};

function applyResolution(key) {
  const r = RESOLUTIONS[key];
  W = r.w; H = r.h;
  canvas.width  = W;
  canvas.height = H;
  const dispW = W * r.scale + 'px';
  const dispH = H * r.scale + 'px';
  document.documentElement.style.setProperty('--canvas-w', dispW);
  document.documentElement.style.setProperty('--canvas-h', dispH);
  document.documentElement.style.setProperty('--canvas-ar', `${W} / ${H}`);
  // Sync font size slider range and default
  const sizeEl = document.getElementById('sizeRange');
  sizeEl.min   = r.sizeMin;
  sizeEl.max   = r.sizeMax;
  sizeEl.step  = r.sizeStep;
  sizeEl.value = r.defaultSize;
  document.getElementById('sizeLabel').textContent = r.defaultSize + ' px';

  scrollX2 = W + 4;
  frame = 0;

// ── Animation state ───────────────────────────────────────
let frame = 0;
let animId = null;

const SPEEDS = [0.4, 0.7, 1.0, 1.5, 2.2]; // multipliers per step 1-5

function getSpeed() {
  const idx = parseInt(document.getElementById('speedRange').value) - 1;
  return SPEEDS[idx];
}

// ── Colour interpolation ──────────────────────────────────
function lerpColor(colors, t) {
  const n = colors.length;
  const scaled = ((t % 1 + 1) % 1) * n;
  const i = Math.floor(scaled) % n;
  const j = (i + 1) % n;
  const f = scaled - Math.floor(scaled);
  return [
    Math.round(colors[i][0] * (1-f) + colors[j][0] * f),
    Math.round(colors[i][1] * (1-f) + colors[j][1] * f),
    Math.round(colors[i][2] * (1-f) + colors[j][2] * f),
  ];
}

// ── Measure each character ────────────────────────────────
function measureChars(text, fontStr) {
  ctx.font = fontStr;
  return [...text].map(ch => ctx.measureText(ch).width);
}

// ── Draw helpers ──────────────────────────────────────────
function drawBackground() {
  const [r, g, b] = BG_RGB;
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, W, H);
}

// ── RTL detection ─────────────────────────────────────────
function isRTL(text) {
  return /[\u0600-\u06ff\u0750-\u077f\u0590-\u05ff\u07c0-\u07ff]/.test(text);
}

// ── Measure full string width ─────────────────────────────
function measureText(text) {
  return ctx.measureText(text).width;
}

// ── Build a rainbow gradient across the text width ────────
function makeRainbowGradient(x, totalW, colors, phase) {
  return makeRainbowGradientOn(ctx, x, totalW, colors, phase);
}

// ── Draw a single whole-string line (RTL-safe) ────────────
function drawWholeLine(text, centerY, colors, phase, waveY) {
  const fontStr = getFont();
  ctx.font = fontStr;
  ctx.textBaseline = 'middle';
  ctx.direction = 'ltr';
  const totalW = measureText(text);
  const x = Math.max(1, (W - totalW) / 2);
  setContextFill(ctx, x, totalW, colors, phase);
  pxFillText(ctx, text, x, centerY + (waveY || 0));
}
// Returns array of center-Y values for each line
function lineYs(n) {
  if (n === 1) return [H / 2];
  // Two lines: divide height into two equal bands
  return [H * 0.28, H * 0.75];
}

// ── Per-line draw: rainbow wave ───────────────────────────
function drawRainbowWaveLine(text, centerY, t, lineIdx, totalLines) {
  const fontStr = getFont();
  ctx.font = fontStr;
  ctx.textBaseline = 'middle';
  const colors = getActiveColors();
  const waveAmp = totalLines === 1 ? 1.5 : 0.8;
  const phase = (t + lineIdx * 0.5) % 1;

  if (isRTL(text)) {
    const waveY = Math.sin(t * Math.PI * 2 + lineIdx * Math.PI) * waveAmp;
    drawWholeLine(text, centerY, colors, phase, waveY);
    return;
  }

  const chars = [...text];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const totalW = widths.reduce((a, b) => a + b, 0);
  const startX = Math.max(1, (W - totalW) / 2);

  // Single gradient across full text width, phase-shifted over time
  setContextFill(ctx, startX, totalW, colors, phase);

  let x = startX;
  chars.forEach((ch, i) => {
    const wy = Math.sin(t * Math.PI * 2 + i * 0.9 + lineIdx * Math.PI) * waveAmp;
    pxFillText(ctx, ch, x, centerY + wy);
    x += widths[i];
  });
}

// ── Per-line draw: scroll ─────────────────────────────────
function drawScrollLine(text, centerY, scrollPos, lineIdx) {
  const fontStr = getFont();
  ctx.font = fontStr;
  ctx.textBaseline = 'middle';
  const colors = getActiveColors();
  const phase = ((scrollPos / W) * 0.5 + 1 + lineIdx * 0.5) % 1;

  const totalW = isRTL(text) ? measureText(text) : [...text].reduce((s, ch) => s + ctx.measureText(ch).width, 0);
  const x = scrollPos - totalW / 2;

  setContextFill(ctx, x, Math.max(totalW, 1), colors, phase);

  if (isRTL(text)) {
    pxFillText(ctx, text, x, centerY);
    return;
  }

  const chars = [...text];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  let cx = x;
  chars.forEach(ch => {
    pxFillText(ctx, ch, cx, centerY);
    cx += ctx.measureText(ch).width;
  });
}

// ── Per-line draw: pulse (彩虹流动) ───────────────────────
function drawPulseLine(text, centerY, t, lineIdx) {
  const fontStr = getFont();
  ctx.font = fontStr;
  ctx.textBaseline = 'middle';
  const colors = getActiveColors();
  const phase = (t * 0.5 + lineIdx * 0.5) % 1;
  const totalW = isRTL(text) ? measureText(text) : [...text].reduce((s, ch) => s + ctx.measureText(ch).width, 0);
  const x = Math.max(1, (W - totalW) / 2);

  setContextFill(ctx, x, Math.max(totalW, 1), colors, phase);

  if (isRTL(text)) {
    pxFillText(ctx, text, x, centerY);
    return;
  }

  const chars = [...text];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  let cx = x;
  chars.forEach(ch => {
    pxFillText(ctx, ch, cx, centerY);
    cx += ctx.measureText(ch).width;
  });
}

// ── Per-line draw: typewriter ─────────────────────────────
function getTypewriterState(tc, n) {
  const typePart = 0.5, holdPart = 0.3, blinkPart = 0.2;
  let charsShown, showCursor;
  if (tc < typePart) {
    charsShown = Math.floor((tc / typePart) * n);
    showCursor = true;
  } else if (tc < typePart + holdPart) {
    charsShown = n;
    showCursor = true;
  } else {
    charsShown = n;
    showCursor = Math.floor(((tc - typePart - holdPart) / blinkPart) * 6) % 2 === 0;
  }
  return { charsShown: Math.min(charsShown, n), showCursor };
}

function drawTypewriterLineOn(targetCtx, text, centerY, t, lineIdx) {
  const fontStr = getFont();
  targetCtx.font = fontStr;
  targetCtx.textBaseline = 'middle';
  const colors = getActiveColors();
  const chars = [...text];
  const n = chars.length;
  if (n === 0) return;

  const tc = (t + lineIdx * 0.5) % 1.0;
  const { charsShown, showCursor } = getTypewriterState(tc, n);

  if (isRTL(text)) {
    const totalW = targetCtx.measureText(text).width;
    const x = Math.max(1, (W - totalW) / 2);
    const revealW = totalW * Math.min(tc / 0.8, 1);
    targetCtx.save();
    targetCtx.beginPath();
    targetCtx.rect(x, 0, revealW, H);
    targetCtx.clip();
    setContextFill(targetCtx, x, totalW, colors, tc);
    pxFillText(targetCtx, text, x, centerY);
    targetCtx.restore();
    if (showCursor) {
      const cx = Math.round(x + revealW + 1);
      const fs = getFontSize();
      const [r, g, b] = isSolidMode() ? getSolidRgb() : lerpColor(colors, tc);
      targetCtx.fillStyle = isSolidMode() ? solidFillStyle() : `rgba(${r},${g},${b},0.9)`;
      targetCtx.fillRect(cx, Math.round(centerY - fs * 0.45), 1, Math.round(fs * 0.9));
    }
    return;
  }

  const allWidths = chars.map(ch => targetCtx.measureText(ch).width);
  const totalW = allWidths.reduce((a, b) => a + b, 0);
  const x = Math.max(1, (W - totalW) / 2);
  const shownW = allWidths.slice(0, charsShown).reduce((a, b) => a + b, 0);

  if (charsShown > 0) {
    targetCtx.save();
    targetCtx.beginPath();
    targetCtx.rect(x, 0, shownW, H);
    targetCtx.clip();
    setContextFill(targetCtx, x, Math.max(totalW, 1), colors, tc);
    let cx = x;
    chars.forEach(ch => {
      pxFillText(targetCtx, ch, cx, centerY);
      cx += targetCtx.measureText(ch).width;
    });
    targetCtx.restore();
  }

  if (showCursor) {
    const curX = Math.round(x + shownW + 1);
    const fs = getFontSize();
    const [r, g, b] = isSolidMode() ? getSolidRgb() : lerpColor(colors, tc);
    targetCtx.fillStyle = isSolidMode() ? solidFillStyle() : `rgba(${r},${g},${b},0.9)`;
    targetCtx.fillRect(curX, Math.round(centerY - fs * 0.45), 1, Math.round(fs * 0.9));
  }
}

function drawTypewriterLine(text, centerY, t, lineIdx) {
  drawTypewriterLineOn(ctx, text, centerY, t, lineIdx);
}

// ── Per-line draw: static ─────────────────────────────────
function drawCenteredLineOn(targetCtx, text, centerY, lineIdx, xOffset = 0) {
  const fontStr = getFont();
  targetCtx.font = fontStr;
  targetCtx.textBaseline = 'middle';
  const colors = getActiveColors();
  const phase = (lineIdx * 0.5) % 1;
  const totalW = isRTL(text)
    ? targetCtx.measureText(text).width
    : [...text].reduce((s, ch) => s + targetCtx.measureText(ch).width, 0);
  const x = Math.max(1, (W - totalW) / 2 + xOffset);

  setContextFill(targetCtx, x, Math.max(totalW, 1), colors, phase);

  if (isRTL(text)) {
    pxFillText(targetCtx, text, x, centerY);
    return;
  }

  const chars = [...text];
  let cx = x;
  chars.forEach(ch => {
    pxFillText(targetCtx, ch, cx, centerY);
    cx += targetCtx.measureText(ch).width;
  });
}

function drawStaticLineOn(targetCtx, text, centerY, lineIdx) {
  drawCenteredLineOn(targetCtx, text, centerY, lineIdx, 0);
}

function drawStaticLine(text, centerY, lineIdx) {
  drawStaticLineOn(ctx, text, centerY, lineIdx);
}

// ── Per-line draw: blink (闪烁) ───────────────────────────
function drawBlinkLine(text, centerY, t, lineIdx) {
  const tc = (t + lineIdx * 0.5) % 1.0;
  const blinkPhase = (tc * 2) % 1;
  if (blinkPhase >= 0.55) return;

  drawCenteredLineOn(ctx, text, centerY, lineIdx, 0);
}

// ── Per-line draw: slide (滑入停留) ───────────────────────
function getSlideOffset(tc, totalW) {
  const slideIn = 0.22;
  const holdEnd = 0.62;
  const slideOutEnd = 0.84;
  const travel = W / 2 + totalW / 2 + 4;

  if (tc < slideIn) {
    const p = tc / slideIn;
    const ease = 1 - (1 - p) ** 2;
    return (1 - ease) * travel;
  }
  if (tc < holdEnd) return 0;
  if (tc < slideOutEnd) {
    const p = (tc - holdEnd) / (slideOutEnd - holdEnd);
    const ease = p ** 2;
    return -ease * travel;
  }
  return -travel;
}

function drawSlideLine(text, centerY, t, lineIdx) {
  const fontStr = getFont();
  ctx.font = fontStr;
  const totalW = isRTL(text)
    ? measureText(text)
    : [...text].reduce((s, ch) => s + ctx.measureText(ch).width, 0);
  const tc = (t + lineIdx * 0.15) % 1.0;
  const xOffset = getSlideOffset(tc, totalW);
  drawCenteredLineOn(ctx, text, centerY, lineIdx, xOffset);
}

// ── Per-line draw: scan (扫描高亮) ────────────────────────
function drawScanLine(text, centerY, t, lineIdx) {
  const fontStr = getFont();
  ctx.font = fontStr;
  ctx.textBaseline = 'middle';
  const colors = getActiveColors();
  const phase = (t * 0.5 + lineIdx * 0.5) % 1;
  const totalW = isRTL(text)
    ? measureText(text)
    : [...text].reduce((s, ch) => s + ctx.measureText(ch).width, 0);
  const startX = Math.max(1, (W - totalW) / 2);
  const bandW = Math.max(6, Math.min(20, totalW * 0.35));
  const scanLeft = startX + (totalW + bandW) * ((t + lineIdx * 0.2) % 1) - bandW;

  drawCenteredLineOn(ctx, text, centerY, lineIdx, 0);

  ctx.save();
  ctx.beginPath();
  ctx.rect(scanLeft, 0, bandW, H);
  ctx.clip();

  if (isSolidMode()) {
    const [sr, sg, sb] = getSolidRgb();
    const [br, bg, bb] = BG_RGB;
    ctx.fillStyle = `rgb(${sr},${sg},${sb})`;
    ctx.fillRect(scanLeft, 0, bandW, H);
    ctx.fillStyle = `rgb(${br},${bg},${bb})`;
    ctx.font = fontStr;
    ctx.textBaseline = 'middle';
    if (isRTL(text)) {
      pxFillText(ctx, text, startX, centerY);
    } else {
      const chars = [...text];
      let cx = startX;
      chars.forEach(ch => {
        pxFillText(ctx, ch, cx, centerY);
        cx += ctx.measureText(ch).width;
      });
    }
  } else {
    setContextFill(ctx, startX, Math.max(totalW, 1), colors, (phase + 0.5) % 1);
    if (isRTL(text)) {
      pxFillText(ctx, text, startX, centerY);
    } else {
      const chars = [...text];
      let cx = startX;
      chars.forEach(ch => {
        pxFillText(ctx, ch, cx, centerY);
        cx += ctx.measureText(ch).width;
      });
    }
  }
  ctx.restore();
}

// ── Per-line draw: wobble ─────────────────────────────────
function drawWobbleLine(text, centerY, t, lineIdx, totalLines) {
  const fontStr = getFont();
  ctx.font = fontStr;
  ctx.textBaseline = 'middle';
  const colors = getActiveColors();
  const maxAngle = 0.28; // radians (~16°)
  const waveAmp  = totalLines === 1 ? 1.2 : 0.6;

  if (isRTL(text)) {
    const totalW = measureText(text);
    const cx = W / 2;
    const angle = Math.sin(t * Math.PI * 2 + lineIdx * Math.PI) * maxAngle;
    const waveY = Math.sin(t * Math.PI * 2 + lineIdx * Math.PI) * waveAmp;
    ctx.save();
    ctx.translate(isSolidMode() ? Math.round(cx) : cx, isSolidMode() ? Math.round(centerY + waveY) : centerY + waveY);
    ctx.rotate(angle);
    setContextFill(ctx, -totalW / 2, totalW, colors, (t + lineIdx * 0.5) % 1);
    pxFillText(ctx, text, -totalW / 2, 0);
    ctx.restore();
    return;
  }

  const chars = [...text];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const totalW = widths.reduce((a, b) => a + b, 0);
  const startX = Math.max(1, (W - totalW) / 2);
  const phase = (t + lineIdx * 0.5) % 1;

  // Pre-build one gradient in screen space; apply it per-char via local coords
  let x = startX;
  chars.forEach((ch, i) => {
    const angle = Math.sin(t * Math.PI * 2 + i * 0.7 + lineIdx * Math.PI) * maxAngle;
    const waveY = Math.sin(t * Math.PI * 2 + i * 0.7 + lineIdx * Math.PI) * waveAmp;
    const charCx = x + widths[i] / 2;

    ctx.save();
    ctx.translate(isSolidMode() ? Math.round(charCx) : charCx, isSolidMode() ? Math.round(centerY + waveY) : centerY + waveY);
    ctx.rotate(angle);
    if (isSolidMode()) {
      ctx.fillStyle = solidFillStyle();
    } else {
      const localLeft  = startX - charCx;
      const localRight = (startX + totalW) - charCx;
      const grad = ctx.createLinearGradient(localLeft, 0, localRight, 0);
      const n = colors.length;
      for (let j = 0; j <= n; j++) {
        const p = j / n;
        const [r, g, b] = lerpColor(colors, (p + phase) % 1);
        grad.addColorStop(p, `rgb(${r},${g},${b})`);
      }
      ctx.fillStyle = grad;
    }
    pxFillText(ctx, ch, -widths[i] / 2, 0);
    ctx.restore();
    x += widths[i];
  });
}
const GLOW_COLORS = {
  rainbow: 'rgba(200,255,0,0.06)',
  fire:    'rgba(255,100,0,0.08)',
  ice:     'rgba(100,200,255,0.07)',
  gold:    'rgba(255,200,0,0.07)',
  neon:    'rgba(0,255,160,0.07)',
};
function updateGlow() {
  let c;
  if (currentPreset === 'solid') {
    const [r, g, b] = getSolidRgb();
    c = `rgba(${r},${g},${b},0.08)`;
  } else {
    c = GLOW_COLORS[currentPreset] || GLOW_COLORS.rainbow;
  }
  document.getElementById('stageGlow').style.background =
    `radial-gradient(ellipse 50% 35% at 50% 50%, ${c} 0%, transparent 70%)`;
}

// ── Scroll state per line ─────────────────────────────────
let scrollX  = W;
let scrollX2 = W; // synced with scrollX

// ── Main render loop ──────────────────────────────────────
function renderSingleFrame(t, speed) {
  const text1  = document.getElementById('textInput').value  || ' ';
  const text2  = document.getElementById('textInput2').value;
  const effect = document.getElementById('effectSelect').value;

  drawBackground();

  const lines = text2.trim() ? [text1, text2] : [text1];
  const ys    = lineYs(lines.length);

  if (effect === 'scroll') {
    const fontStr = getFont();
    ctx.font = fontStr;
    const scrollSpeed = speed * 0.6;

    const w1 = isRTL(text1) ? measureText(text1) : [...text1].reduce((s, ch) => s + ctx.measureText(ch).width, 0);
    const w2 = lines.length > 1
      ? (isRTL(text2) ? measureText(text2) : [...text2].reduce((s, ch) => s + ctx.measureText(ch).width, 0))
      : 0;

    const maxHalfW = Math.max(w1, w2) / 2;
    const startX = W + maxHalfW + 4;
    const endX   = -(maxHalfW + 4);
    scrollX -= scrollSpeed;
    if (scrollX < endX) scrollX = startX;

    drawScrollLine(text1, ys[0], scrollX, 0);
    if (lines.length > 1) {
      drawScrollLine(text2, ys[1], scrollX, 1);
    }

    lines.forEach((txt, i) => drawRainbowWaveLine(txt, ys[i], t, i, lines.length));
  } else if (effect === 'wobble') {
    lines.forEach((txt, i) => drawWobbleLine(txt, ys[i], t, i, lines.length));
  } else if (effect === 'pulse') {
    lines.forEach((txt, i) => drawPulseLine(txt, ys[i], t, i));
  } else if (effect === 'typewriter') {
    lines.forEach((txt, i) => drawTypewriterLine(txt, ys[i], t, i));
  } else if (effect === 'blink') {
    lines.forEach((txt, i) => drawBlinkLine(txt, ys[i], t, i));
  } else if (effect === 'slide') {
    lines.forEach((txt, i) => drawSlideLine(txt, ys[i], t, i));
  } else if (effect === 'scan') {
    lines.forEach((txt, i) => drawScanLine(txt, ys[i], t, i));
  } else if (effect === 'static') {
    lines.forEach((txt, i) => drawStaticLine(txt, ys[i], i));

function render() {
  frame++;
  const speed = getSpeed();
  const t = (frame * speed) / 120;
  renderSingleFrame(t, speed);
  animId = requestAnimationFrame(render);
}

// ── Font preloading ───────────────────────────────────────
async function preloadFonts() {
  await document.fonts.load(`normal 16px ${UNIFONT}`);
  await document.fonts.load(`normal 8px ${UNIFONT}`);
  await document.fonts.load(`normal 32px ${UNIFONT}`);
  const notoFamilies = ['Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans', 'Noto Sans Arabic'];
  for (const f of notoFamilies) {
    try {
      await document.fonts.load(`normal 16px '${f}'`);
      await document.fonts.load(`normal 8px '${f}'`);
      await document.fonts.load(`normal 32px '${f}'`);
    } catch (e) {}
  }
  await document.fonts.ready;
}

// ── Event listeners ───────────────────────────────────────
document.getElementById('resSelect').addEventListener('change', function() {
  applyResolution(this.value);
});

document.getElementById('textInput').addEventListener('input', () => {
  scrollX = W + 4;
});

document.getElementById('textInput2').addEventListener('input', () => {
  scrollX2 = W + 4;
});

document.getElementById('speedRange').addEventListener('input', function() {
  const labels = ['×0.4','×0.7','×1.0','×1.5','×2.2'];
  document.getElementById('speedLabel').textContent = labels[this.value - 1];
});

document.getElementById('sizeRange').addEventListener('input', function() {
  document.getElementById('sizeLabel').textContent = this.value + ' px';
  scrollX  = W + 4;
  scrollX2 = W + 4;
});

document.getElementById('effectSelect').addEventListener('change', () => {
  scrollX  = W + 4;
  scrollX2 = W + 4;
  frame = 0;
  updateExportControls();
});

document.getElementById('presetRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.preset-btn');
  if (!btn) return;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPreset = btn.dataset.preset;
  updateSolidDisplayMode();
  updateGlow();
});

document.getElementById('solidColorInput').addEventListener('input', function() {
  solidColor = this.value;
  updateSolidColorHex();
  if (currentPreset === 'solid') updateGlow();
});

document.getElementById('toleranceRange').addEventListener('input', function() {
  document.getElementById('toleranceLabel').textContent = this.value;
});

// ── GIF Export (gif.js) ───────────────────────────────────
let gifWorkerScriptUrl = null;

function getGifWorkerScriptUrl() {
  if (gifWorkerScriptUrl) return gifWorkerScriptUrl;

  // file:// 无法加载 CDN / 跨域 Worker；用内嵌源码生成 Blob URL（同源）
  const inline = document.getElementById('gif-worker-src');
  if (inline && inline.textContent.trim()) {
    gifWorkerScriptUrl = URL.createObjectURL(
      new Blob([inline.textContent], { type: 'application/javascript' })
    );
    return gifWorkerScriptUrl;
  }

  // 备用：同目录 gif.worker.js（需与 HTML 放在同一文件夹）
  return 'gif.worker.js';
}

function getGifExportFps() {
  return parseInt(document.getElementById('gifFpsSelect').value, 10) || 30;
}

function getGifExportPlan() {
  const effect = document.getElementById('effectSelect').value;
  const speed = getSpeed();
  const fps = getGifExportFps();
  const cycleFrames = Math.round(120 / speed);
  const frameDelay = Math.round(1000 / fps);

  if (effect === 'static') {
    return { totalFrames: 1, frameDelay: 500 };
  }

  return { totalFrames: cycleFrames, frameDelay };
}

function exportGIF() {
  const btn    = document.getElementById('exportBtn');
  const status = document.getElementById('exportStatus');

  if (typeof GIF === 'undefined') {
    status.className = 'export-status err';
    status.textContent = 'GIF 库未加载（需联网加载 gif.js）';
    return;
  }

  btn.disabled = true;
  status.className = 'export-status';
  status.textContent = '正在渲染帧…';

  const speed = getSpeed();
  const fps = getGifExportFps();
  const { totalFrames, frameDelay } = getGifExportPlan();

  const savedFrame   = frame;
  const savedScrollX = scrollX;
  cancelAnimationFrame(animId);

  const text1 = document.getElementById('textInput').value || ' ';

  scrollX = W + 4;
  scrollX2 = W + 4;

  let gif;
  try {
    gif = new GIF({
      workers: 2,
      quality: isSolidMode() ? 20 : 10,
      globalPalette: true,
      repeat: 0,
      width: W,
      height: H,
      workerScript: getGifWorkerScriptUrl(),
    });
  } catch (err) {
    status.className = 'export-status err';
    status.textContent = 'GIF worker 初始化失败';
    btn.disabled = false;
    frame = savedFrame;
    scrollX = savedScrollX;
    render();
    return;
  }

  for (let f = 0; f < totalFrames; f++) {
    const t = (f * speed) / 120;
    renderSingleFrame(t, speed);
    gif.addFrame(canvas, { copy: true, delay: frameDelay });
    if (f % 5 === 0) status.textContent = `渲染帧 ${f + 1}/${totalFrames}…`;
  }

  status.textContent = '编码中…';

  gif.on('progress', (p) => {
    status.textContent = `编码中… ${Math.round(p * 100)}%`;
  });

  gif.on('finished', (blob) => {
    frame = savedFrame;
    scrollX = savedScrollX;
    render();

    const kb = (blob.size / 1024).toFixed(1);
    status.className = 'export-status ok';
    status.textContent = `完成！${kb} KB · ${fps} fps · ${totalFrames} 帧`;
    btn.disabled = false;

    const label = text1.slice(0, 10).replace(/\s+/g, '_');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `led_${W}x${H}_${label}.gif`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  gif.on('abort', () => {
    frame = savedFrame;
    scrollX = savedScrollX;
    render();
    status.className = 'export-status err';
    status.textContent = '导出失败，请重试';
    btn.disabled = false;
  });

  gif.render();
}

document.getElementById('exportBtn').addEventListener('click', exportGIF);

function exportStaticPNG() {
  if (!canExportStaticPNG()) return;

  const btn = document.getElementById('exportPngBtn');
  const status = document.getElementById('exportStatus');
  btn.disabled = true;
  status.className = 'export-status';
  status.textContent = '正在导出 PNG…';

  const oc = document.createElement('canvas');
  oc.width = W;
  oc.height = H;
  const octx = oc.getContext('2d');
  octx.imageSmoothingEnabled = false;

  const [br, bg, bb] = BG_RGB;
  octx.fillStyle = `rgb(${br},${bg},${bb})`;
  octx.fillRect(0, 0, W, H);

  const text1 = document.getElementById('textInput').value || ' ';
  const text2 = document.getElementById('textInput2').value;
  const lines = text2.trim() ? [text1, text2] : [text1];
  const ys = lineYs(lines.length);

  lines.forEach((txt, i) => drawStaticLineOn(octx, txt, ys[i], i));
  if (isSolidMode()) applySolidQuantize(octx);

  oc.toBlob((blob) => {
    if (!blob) {
      status.className = 'export-status err';
      status.textContent = '导出失败，请重试';
      updateExportControls();
      return;
    }
    const label = text1.slice(0, 10).replace(/\s+/g, '_');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `led_${W}x${H}_${label}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
    status.className = 'export-status ok';
    status.textContent = `PNG 已导出 · ${W}×${H}`;
    updateExportControls();
  }, 'image/png');
}

document.getElementById('exportPngBtn').addEventListener('click', exportStaticPNG);

// ── Boot ──────────────────────────────────────────────────
preloadFonts().then(() => {
  applyResolution('96x16');
  updateSolidColorHex();
  updateSolidDisplayMode();
  updateExportControls();
  render();
});
