<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" id="theme-color" content="#faf9f5">
<title>Circular Maze</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f5;--sur:#ffffff;--dark:#141413;--mid:#b0aea5;--lg:#e8e6dc;--or:#d97757;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Roboto',sans-serif;color:var(--dark)}

/* ── Main layout: maze top, controls bottom ── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#maze-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 8px 0}
#cc canvas{display:block;touch-action:none}
#status-msg{text-align:center;font-size:13px;font-weight:600;color:var(--or);height:20px;padding:2px 0}

/* ── Bottom panel ── */
#bottom{background:var(--sur);border-top:1px solid var(--lg);padding:8px 16px calc(8px + var(--safe-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}

/* ── D-pad ── */
#dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:5px;user-select:none}
#dpad button{width:56px;height:56px;padding:0;font-size:22px;border:none;border-radius:12px;background:var(--lg);color:var(--dark);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;-webkit-user-select:none;touch-action:manipulation}
#dpad button:active,#dpad button.pressed{background:var(--or);color:#fff}
#dpad .center{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mid)}

/* ── Landscape: dpad moves to the right, maze fills left ── */
@media (orientation:landscape) and (max-height:600px) {
  #app{flex-direction:row;flex-wrap:wrap}
  #topbar{width:100%;order:0;padding:4px 12px 0}
  #topbar h1{font-size:13px}
  .icon-btn{font-size:16px;padding:3px}
  #status-msg{width:100%;order:1;height:14px;font-size:11px;padding:0}
  #maze-wrap{order:2;flex:1;min-width:0;padding:4px 4px 4px 8px;align-self:stretch}
  #bottom{order:3;width:auto;flex-shrink:0;border-top:none;border-left:1px solid var(--lg);padding:8px 12px calc(8px + var(--safe-bottom));justify-content:center;align-self:stretch}
  #dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
  #dpad button{width:44px;height:44px;font-size:18px;border-radius:10px}
  .hint{font-size:9px}
}

/* ── Top bar ── */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 0;flex-shrink:0}
#topbar h1{font-family:'Roboto',sans-serif;font-size:17px;font-weight:400}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;font-size:20px;color:var(--dark);transition:background .15s}
.icon-btn:hover{background:var(--lg)}
.topbar-btns{display:flex;gap:4px}

/* ── Settings drawer ── */
#drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
#drawer-bg.open{opacity:1;pointer-events:all}
#drawer{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-radius:18px 18px 0 0;z-index:11;padding:16px 20px calc(20px + var(--safe-bottom));max-height:80vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0)}
#drawer.open{transform:translateY(0)}
#drawer h2{font-family:'Roboto',sans-serif;font-size:16px;font-weight:400;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
#drawer h2 button{background:none;border:none;font-size:22px;cursor:pointer;color:var(--mid);padding:0}

.section{margin-bottom:20px}
.stitle{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.stitle::before{content:'';width:10px;height:2px;background:var(--or);border-radius:1px}
.seed-box{width:100%;background:var(--bg);border:1.5px solid var(--lg);border-radius:8px;padding:10px;font-family:'Roboto',sans-serif;font-size:15px;text-align:center;color:var(--dark);margin-bottom:8px;transition:border-color .2s}
.seed-box:focus{outline:none;border-color:var(--or)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.g1{margin-bottom:7px}
button.btn{display:block;width:100%;padding:10px 12px;border:none;border-radius:8px;font-family:'Roboto',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:var(--lg);color:var(--dark);transition:all .15s;touch-action:manipulation}
button.btn:hover,button.btn:active{background:var(--mid);color:#fff}
button.btn.accent{background:var(--or);color:#fff}
button.btn.accent:active{background:#c46640}
.ctrl{margin-bottom:14px}
.ctrl label{display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:7px}
.ctrl label span{font-family:'Roboto',sans-serif;color:var(--mid);font-size:12px}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:var(--lg);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--or);border-radius:50%;cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;background:var(--or);border-radius:50%;border:none;cursor:pointer}

.trow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.trow>label:first-child{font-size:13px;font-weight:500}
.tog{position:relative;width:38px;height:22px}
.tog input{opacity:0;width:0;height:0}
.tslider{position:absolute;inset:0;background:var(--lg);border-radius:22px;cursor:pointer;transition:.2s}
.tslider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+.tslider{background:var(--or)}
.tog input:checked+.tslider::before{transform:translateX(16px)}

.diff-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:4px}
.diff-btn{padding:10px 4px;border:2px solid var(--lg);border-radius:10px;background:var(--bg);font-family:'Roboto',sans-serif;font-size:11px;font-weight:600;cursor:pointer;text-align:center;line-height:1.4;transition:all .15s;color:var(--dark)}
.diff-btn:active{opacity:.7}
.diff-btn.active{border-color:var(--or);background:var(--or);color:#fff}
.diff-btn .emoji{font-size:18px;display:block;margin-bottom:3px}
</style>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <div id="topbar">
    <h1>⭕ Circular Maze</h1>
    <div class="topbar-btns">
      <button class="icon-btn" onclick="resetPlayer()" title="Restart">↩️</button>
      <button class="icon-btn" onclick="rndSeed()" title="Random maze">🎲</button>
      <button class="icon-btn" onclick="openDrawer()" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- Status -->
  <div id="status-msg"></div>

  <!-- Maze canvas -->
  <div id="maze-wrap">
    <div id="cc"></div>
  </div>

  <!-- Bottom controls -->
  <div id="bottom">
    <div id="dpad">
      <div></div>
      <button id="btn-out" ontouchstart="handleDpad(event,'out')" onmousedown="handleDpad(event,'out')">↑</button>
      <div></div>
      <button id="btn-ccw" ontouchstart="handleDpad(event,'ccw')" onmousedown="handleDpad(event,'ccw')">←</button>
      <div class="center">●</div>
      <button id="btn-cw"  ontouchstart="handleDpad(event,'cw')"  onmousedown="handleDpad(event,'cw')">→</button>
      <div></div>
      <button id="btn-in"  ontouchstart="handleDpad(event,'in')"  onmousedown="handleDpad(event,'in')">↓</button>
      <div></div>
    </div>
    <div class="hint">↑ Outward &nbsp; ↓ Inward &nbsp; ← Counter-clockwise &nbsp; → Clockwise</div>
  </div>
</div>

<!-- Settings drawer -->
<div id="drawer-bg" onclick="closeDrawer()"></div>
<div id="drawer">
  <h2>Settings <button onclick="closeDrawer()">×</button></h2>

  <div class="section">
    <div class="stitle">Difficulty</div>
    <div class="diff-btns">
      <button class="diff-btn active" id="diff-easy" onclick="setDiff('easy')"><span class="emoji">🗺️</span>Treasure Hunt<br><span style="font-weight:400;color:inherit;font-size:10px">Easy</span></button>
      <button class="diff-btn" id="diff-medium" onclick="setDiff('medium')"><span class="emoji">🏝️</span>Island Survival<br><span style="font-weight:400;color:inherit;font-size:10px">Medium</span></button>
      <button class="diff-btn" id="diff-hard" onclick="setDiff('hard')"><span class="emoji">🕳️</span>Cave Explorer<br><span style="font-weight:400;color:inherit;font-size:10px">Hard</span></button>
    </div>
  </div>

  <div class="section">
    <div class="stitle">Seed</div>
    <input class="seed-box" id="seed-input" type="number" value="12345" onchange="applySeed()">
    <div class="g2">
      <button class="btn" onclick="prevSeed()">← Previous</button>
      <button class="btn" onclick="nextSeed()">Next →</button>
    </div>
    <div class="g1"><button class="btn accent" onclick="rndSeed();closeDrawer()">🎲 Random Seed</button></div>
  </div>

  <div class="section">
    <div class="stitle">Parameters</div>
    <div class="ctrl">
      <label>Rings <span id="lv-rings">9</span></label>
      <input type="range" id="sl-rings" min="3" max="24" step="1" value="9" oninput="sp('rings',+this.value,'lv-rings')">
    </div>
    <div class="ctrl">
      <label>Sectors <span id="lv-inner">12</span></label>
      <input type="range" id="sl-inner" min="4" max="30" step="2" value="12" oninput="sp('innerCells',+this.value,'lv-inner')">
    </div>
    <div class="trow">
      <label>Show Solution</label>
      <label class="tog"><input type="checkbox" id="chk-sol" onchange="st('showSolution',this.checked)"><span class="tslider"></span></label>
    </div>
    <div class="trow">
      <label>Show Trail</label>
      <label class="tog"><input type="checkbox" id="chk-trail" checked onchange="st('showTrail',this.checked)"><span class="tslider"></span></label>
    </div>
  </div>

  <div class="section">
    <div class="stitle">Actions</div>
    <div class="g2" style="margin-bottom:8px">
      <button class="btn" onclick="resetPlayer();closeDrawer()">Restart</button>
      <button class="btn" onclick="resetAll()">Reset All</button>
    </div>
  </div>
</div>

<script>
// ── PRNG ───────────────────────────────────────────────────────
function mkRng(seed){
    let s=seed>>>0;
    return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
}

// ── Params ─────────────────────────────────────────────────────
const BG='#faf9f5', WALL='#1a1917', PATH='#d97757';
let params={seed:12345,rings:9,innerCells:12,showSolution:false,showTrail:true,difficulty:'easy'};
const DEF={...params};

function wallWeight(){
    const t=params.rings+params.innerCells;
    if(t<=12) return 2;
    if(t<=24) return 1.5;
    if(t<=36) return 1;
    return 0.5;
}

// ── Player ─────────────────────────────────────────────────────
let player={hub:true}, trail=[], visited=new Set(), won=false, steps=0;

// Encode pos to string key for visited set
function posKey(pos){return pos.hub?'hub':`${pos.r},${pos.s}`;}

// Get visible cell keys for current player position
function getVisible(grid,counts,rings,hubEntry){
    const vis=new Set();
    // Helper: add a cell and its direct passable neighbors
    function addCell(key){
        vis.add(key);
    }
    function neighborsOf(pos){
        const nb=[];
        if(pos.hub){
            // hub is adjacent to all ring-0 cells
            for(let s=0;s<counts[0];s++) nb.push(`0,${s}`);
        } else {
            const{r,s}=pos, n=counts[r];
            if(r+1<rings) nb.push(`${r+1},${s}`);
            if(r===0) nb.push('hub');
            else nb.push(`${r-1},${s}`);
            nb.push(`${r},${(s+1)%n}`);
            nb.push(`${r},${(s-1+n)%n}`);
        }
        return nb;
    }
    function passableNeighborsOf(pos){
        const nb=[];
        if(pos.hub){
            if(!grid[0][hubEntry].walls[0]) nb.push(`0,${hubEntry}`);
        } else {
            const{r,s}=pos, n=counts[r];
            if(r+1<rings&&!grid[r][s].walls[1]) nb.push(`${r+1},${s}`);
            if(r===0&&s===hubEntry&&!grid[r][s].walls[0]) nb.push('hub');
            else if(r>0&&!grid[r][s].walls[0]) nb.push(`${r-1},${s}`);
            if(!grid[r][s].walls[2]) nb.push(`${r},${(s+1)%n}`);
            if(!grid[r][s].walls[3]) nb.push(`${r},${(s-1+n)%n}`);
        }
        return nb;
    }
    function keyToPos(key){ if(key==='hub')return{hub:true}; const[r,s]=key.split(',').map(Number);return{r,s}; }

    // Layer 0: current cell
    const cur=posKey(player);
    vis.add(cur);

    // Layer 1: passable neighbors (cells player can directly reach)
    const layer1=passableNeighborsOf(player);
    for(const k of layer1) vis.add(k);

    // Wall-visibility layer: all adjacents (passable or not) of current + layer1
    // These cells are added to a separate "wallVis" set — their walls are drawn
    // but they count as visible for wall-drawing purposes
    const wallVis=new Set(vis);
    for(const k of [cur,...layer1]){
        for(const nk of neighborsOf(keyToPos(k))) wallVis.add(nk);
    }

    return{vis, wallVis};
}

function resetPlayer(){
    player={hub:true}; trail=[{hub:true}]; visited=new Set(['hub']); won=false; steps=0;
    document.getElementById('status-msg').textContent='';
    // Pre-populate visited with initial visibility for medium mode
    if(params.difficulty==='medium'&&maze){
        const{wallVis}=getVisible(maze.grid,maze.counts,params.rings,maze.hubEntry);
        for(const k of wallVis) visited.add(k);
    }
    if(inst)inst.redraw();
}

// ── Maze builder ───────────────────────────────────────────────
function buildMaze(rings,n,rng){
    const counts=Array(rings).fill(n);
    const grid=counts.map(n=>Array.from({length:n},()=>({visited:false,walls:[true,true,true,true]})));
    function getNbs(r,s){
        const nb=[],n=counts[r];
        if(r+1<rings)nb.push({r:r+1,s,w:1,nw:0});
        if(r>0)nb.push({r:r-1,s,w:0,nw:1});
        nb.push({r,s:(s+1)%n,w:2,nw:3});
        nb.push({r,s:(s-1+n)%n,w:3,nw:2});
        return nb;
    }
    const stack=[{r:0,s:0}];
    grid[0][0].visited=true;
    while(stack.length){
        const{r,s}=stack[stack.length-1];
        const uv=getNbs(r,s).filter(nb=>!grid[nb.r][nb.s].visited);
        if(!uv.length){stack.pop();continue;}
        const nb=uv[Math.floor(rng()*uv.length)];
        grid[r][s].walls[nb.w]=false;
        grid[nb.r][nb.s].walls[nb.nw]=false;
        grid[nb.r][nb.s].visited=true;
        stack.push({r:nb.r,s:nb.s});
    }
    const hubEntry=Math.floor(rng()*n);
    grid[0][hubEntry].walls[0]=false;
    return{grid,counts,hubEntry};
}

// ── BFS solver ─────────────────────────────────────────────────
function solveMaze(grid,counts,rings,hubEntry){
    const key=(r,s)=>r*2048+s, seen=new Set();
    function getNbs(r,s){const n=counts[r],nb=[];if(r+1<rings)nb.push({r:r+1,s,w:1});if(r>0)nb.push({r:r-1,s,w:0});nb.push({r,s:(s+1)%n,w:2});nb.push({r,s:(s-1+n)%n,w:3});return nb;}
    seen.add(key(0,hubEntry));
    const q=[{r:0,s:hubEntry,path:[{r:0,s:hubEntry}]}];
    while(q.length){
        const{r,s,path}=q.shift();
        if(r===rings-1&&s===0)return path;
        for(const nb of getNbs(r,s))if(!grid[r][s].walls[nb.w]&&!seen.has(key(nb.r,nb.s))){seen.add(key(nb.r,nb.s));q.push({r:nb.r,s:nb.s,path:[...path,{r:nb.r,s:nb.s}]});}
    }
    return[];
}

// ── Move ───────────────────────────────────────────────────────
function move(dir){
    if(!maze||won)return;
    const{grid,counts,hubEntry}=maze, rings=params.rings;
    let moved=false;
    if(player.hub){
        if(dir==='out'){player={r:0,s:hubEntry};moved=true;}
    } else {
        const{r,s}=player, n=counts[r];
        if(dir==='out'&&r<rings-1&&!grid[r][s].walls[1]){player={r:r+1,s};moved=true;}
        else if(dir==='in'){
            if(r===0&&s===hubEntry&&!grid[r][s].walls[0]){player={hub:true};moved=true;}
            else if(r>0&&!grid[r][s].walls[0]){player={r:r-1,s};moved=true;}
        }
        else if(dir==='cw'&&!grid[r][s].walls[2]){player={r,s:(s+1)%n};moved=true;}
        else if(dir==='ccw'&&!grid[r][s].walls[3]){player={r,s:(s-1+n)%n};moved=true;}
    }
    if(moved){
        steps++;
        trail.push({...player});
        visited.add(posKey(player));
        // In medium mode, also permanently reveal wall-visible cells
        if(params.difficulty==='medium'&&maze){
            const{vis,wallVis}=getVisible(maze.grid,maze.counts,params.rings,maze.hubEntry);
            for(const k of wallVis) visited.add(k);
        }
        if(!player.hub&&player.r===params.rings-1&&player.s===0){
            won=true;
            document.getElementById('status-msg').textContent=`🎉 You made it! ${steps} steps`;
        }
        inst.redraw();
    }
}

// ── D-pad handler ──────────────────────────────────────────────
function handleDpad(e, d){
    e.preventDefault();
    e.stopPropagation();
    const btn=document.getElementById('btn-'+d);
    btn.classList.add('pressed');
    setTimeout(()=>btn.classList.remove('pressed'), 150);
    move(d);
}

// ── p5 sketch ──────────────────────────────────────────────────
let inst, maze;
const sketch=p=>{
    const TWO_PI=Math.PI*2, HALF_PI=Math.PI/2;

    p.setup=()=>{
        const sz=csize();
        const cv=p.createCanvas(sz,sz);
        cv.parent('cc');
        cv.elt.setAttribute('tabindex','0');
        p.noLoop();
        rebuild();
    };

    p.windowResized=()=>{p.resizeCanvas(csize(),csize());p.redraw();};

    p.keyPressed=()=>{
        if(document.activeElement===document.getElementById('seed-input'))return true;
        if(p.keyCode===p.UP_ARROW)move('out');
        else if(p.keyCode===p.DOWN_ARROW)move('in');
        else if(p.keyCode===p.RIGHT_ARROW)move('cw');
        else if(p.keyCode===p.LEFT_ARROW)move('ccw');
        return false;
    };

    function csize(){
        const landscape = window.innerWidth > window.innerHeight && window.innerHeight < 600;
        if(landscape){
            const bottomW = document.getElementById('bottom').getBoundingClientRect().width || 160;
            const topH = document.getElementById('topbar').getBoundingClientRect().height + 14;
            const availW = window.innerWidth - bottomW - 16;
            const availH = window.innerHeight - topH - 8;
            return Math.floor(Math.min(availW, availH, 600));
        }
        const bottomH = document.getElementById('bottom').getBoundingClientRect().height || 130;
        const topH = document.getElementById('topbar').getBoundingClientRect().height + 20 + 16;
        const h = window.innerHeight - topH - bottomH - 8;
        return Math.floor(Math.min(window.innerWidth - 16, h, 600));
    }

    function rebuild(){
        maze=buildMaze(params.rings,params.innerCells,mkRng(params.seed));
        resetPlayer();
    }

    function sarc(cx,cy,r,a1,a2){
        if(a2-a1<0.001)return;
        const steps=Math.max(3,Math.ceil((a2-a1)/0.05));
        p.beginShape();
        for(let i=0;i<=steps;i++){const a=a1+(a2-a1)*i/steps;p.vertex(cx+r*Math.cos(a),cy+r*Math.sin(a));}
        p.endShape();
    }

    function getRadii(rings,maxR){
        const radii=[];
        for(let r=0;r<=rings;r++)radii.push(maxR*Math.pow(r/rings,0.7));
        return radii;
    }

    function posToXY(pos,counts,radii,hubR,cx,cy){
        if(pos.hub)return[cx,cy];
        const{r,s}=pos, n=counts[r];
        const a=(s+0.5)/n*TWO_PI-HALF_PI;
        const rm=(radii[r]+radii[r+1])/2;
        return[cx+rm*Math.cos(a),cy+rm*Math.sin(a)];
    }

    p.draw=()=>{
        if(!maze)return;
        const{grid,counts,hubEntry}=maze, rings=params.rings;
        const cx=p.width/2, cy=p.height/2;
        const maxR=Math.min(cx,cy)-8;
        const radii=getRadii(rings,maxR);
        const hubR=radii[1]*0.42;
        const[bR,bG,bB]=hex3(BG);
        const[wR,wG,wB]=hex3(WALL);
        const[pR,pG,pB]=hex3(PATH);
        const diff=params.difficulty;

        // Compute visible cells
        const{vis:nowVis, wallVis:nowWallVis} = getVisible(grid,counts,rings,hubEntry);
        function isVis(key){
            if(diff==='easy') return true;
            if(diff==='medium') return visited.has(key)||nowVis.has(key);
            return nowVis.has(key);
        }
        function isWallVis(key){
            if(diff==='easy') return true;
            if(diff==='medium') return visited.has(key)||nowWallVis.has(key);
            return nowWallVis.has(key);
        }
        function isCellVis(r,s){ return isVis(`${r},${s}`); }
        function isCellWallVis(r,s){ return isWallVis(`${r},${s}`); }
        function isHubVis(){ return isVis('hub'); }
        function isHubWallVis(){ return isWallVis('hub'); }

        p.background(bR,bG,bB);

        // Helper: draw a path (array of pos) with arcs on same ring, lines across rings
        function drawPathLine(positions, visCheck) {
            // Build segments of consecutive visible positions
            // Between two consecutive same-ring positions: draw arc at mid-radius
            // Otherwise: draw straight line
            const pts = positions.filter(pos => visCheck(posKey(pos)));
            if (pts.length < 2) {
                // single visible point — just draw it
                if (pts.length === 1) {
                    const [x,y] = posToXY(pts[0],counts,radii,hubR,cx,cy);
                    p.point(x,y);
                }
                return;
            }
            // Walk through consecutive visible pairs from original positions array
            // We need to preserve order and break on invisible gaps
            let seg = [];
            for (let i = 0; i < positions.length; i++) {
                const pos = positions[i];
                const vis = visCheck(posKey(pos));
                if (vis) {
                    seg.push(pos);
                } else {
                    if (seg.length >= 2) flushSeg(seg);
                    seg = [];
                }
            }
            if (seg.length >= 2) flushSeg(seg);

            function flushSeg(seg) {
                // Draw segment by segment between consecutive pairs
                for (let i = 0; i < seg.length - 1; i++) {
                    const a = seg[i], b = seg[i+1];
                    drawSegment(a, b);
                }
            }

            function drawSegment(a, b) {
                // Same ring, neither is hub → draw arc
                if (!a.hub && !b.hub && a.r === b.r) {
                    const r = a.r, n = counts[r];
                    const rm = (radii[r] + radii[r+1]) / 2;
                    const aA = (a.s + 0.5) / n * TWO_PI - HALF_PI;
                    const bA = (b.s + 0.5) / n * TWO_PI - HALF_PI;
                    // Pick shortest arc direction
                    let diff = bA - aA;
                    if (diff >  Math.PI) diff -= TWO_PI;
                    if (diff < -Math.PI) diff += TWO_PI;
                    const steps = Math.max(4, Math.ceil(Math.abs(diff) / 0.05));
                    p.beginShape();
                    for (let k = 0; k <= steps; k++) {
                        const ang = aA + diff * k / steps;
                        p.vertex(cx + rm * Math.cos(ang), cy + rm * Math.sin(ang));
                    }
                    p.endShape();
                } else {
                    // Straight line (radial or hub transition)
                    const [ax,ay] = posToXY(a,counts,radii,hubR,cx,cy);
                    const [bx,by] = posToXY(b,counts,radii,hubR,cx,cy);
                    p.line(ax,ay,bx,by);
                }
            }
        }

        // ── Solution path (only show segments in visible cells) ──
        if(params.showSolution){
            const path=solveMaze(grid,counts,rings,hubEntry);
            p.noStroke();p.fill(pR,pG,pB,35);
            for(const{r,s}of path){
                if(!isCellVis(r,s))continue;
                const n=counts[r],a1=s/n*TWO_PI-HALF_PI,a2=(s+1)/n*TWO_PI-HALF_PI;
                const ri=radii[r],ro=radii[r+1],steps=Math.max(4,Math.ceil((a2-a1)/0.07));
                p.beginShape();
                for(let i=0;i<=steps;i++){const a=a1+(a2-a1)*i/steps;p.vertex(cx+ro*Math.cos(a),cy+ro*Math.sin(a));}
                for(let i=steps;i>=0;i--){const a=a1+(a2-a1)*i/steps;p.vertex(cx+ri*Math.cos(a),cy+ri*Math.sin(a));}
                p.endShape(p.CLOSE);
            }
            p.noFill();p.stroke(pR,pG,pB,120);p.strokeWeight(2);p.strokeCap(p.ROUND);p.strokeJoin(p.ROUND);
            const fullPath=[{hub:true},...path];
            drawPathLine(fullPath, k => isVis(k));
        }

        // ── Trail (only visible positions) ──
        if(params.showTrail&&trail.length>1){
            p.noFill();p.stroke(pR,pG,pB,90);p.strokeWeight(Math.max(2,maxR/rings*0.18));
            p.strokeCap(p.ROUND);p.strokeJoin(p.ROUND);
            drawPathLine(trail, k => isVis(k));
        }

        // ── Walls (use wallVis for wider wall visibility) ──
        p.noFill();p.stroke(wR,wG,wB);p.strokeWeight(wallWeight());p.strokeCap(p.ROUND);
        for(let r=0;r<rings;r++){
            const n=counts[r],ri=(r===0)?hubR:radii[r],ro=radii[r+1];
            for(let s=0;s<n;s++){
                if(!isCellWallVis(r,s))continue;
                const cell=grid[r][s];
                const a1=s/n*TWO_PI-HALF_PI,a2=(s+1)/n*TWO_PI-HALF_PI;
                if(r===0&&cell.walls[0])sarc(cx,cy,hubR,a1,a2);
                if(cell.walls[1]){
                    const isExit=(r===rings-1&&s===0);
                    if(isExit){const mid=(a1+a2)/2,gh=(a2-a1)*0.35;sarc(cx,cy,ro,a1,mid-gh);sarc(cx,cy,ro,mid+gh,a2);}
                    else sarc(cx,cy,ro,a1,a2);
                }
                if(cell.walls[2]){const a=a2;p.line(cx+ri*Math.cos(a),cy+ri*Math.sin(a),cx+ro*Math.cos(a),cy+ro*Math.sin(a));}
            }
        }

        // ── Hub circle with gap ──
        if(isHubWallVis()){
            const n=counts[0],em=(hubEntry+0.5)/n*TWO_PI-HALF_PI,gh=(TWO_PI/n)*1.0;
            sarc(cx,cy,hubR,em+gh,em-gh+TWO_PI);
        }



        // ── Fog overlay for non-easy modes ──
        if(diff!=='easy'){
            // Draw fog over invisible cells
            p.noStroke();
            const fogC=p.color(bR,bG,bB,235);
            p.fill(fogC);
            for(let r=0;r<rings;r++){
                const n=counts[r],ri=radii[r],ro=radii[r+1];
                for(let s=0;s<n;s++){
                    if(isCellWallVis(r,s))continue;
                    const a1=s/n*TWO_PI-HALF_PI,a2=(s+1)/n*TWO_PI-HALF_PI;
                    const steps=Math.max(4,Math.ceil((a2-a1)/0.07));
                    p.beginShape();
                    for(let i=0;i<=steps;i++){const a=a1+(a2-a1)*i/steps;p.vertex(cx+ro*Math.cos(a),cy+ro*Math.sin(a));}
                    for(let i=steps;i>=0;i--){const a=a1+(a2-a1)*i/steps;p.vertex(cx+ri*Math.cos(a),cy+ri*Math.sin(a));}
                    p.endShape(p.CLOSE);
                }
            }
            // fog over hub if not visible
            if(!isHubWallVis()){
                p.fill(fogC);
                p.circle(cx,cy,radii[1]*2);
            }
        }

        // ── Player ──
        {
            const[px,py]=posToXY(player,counts,radii,hubR,cx,cy);
            const outerRingW=radii[rings]-radii[rings-1];
            const ballR=Math.max(2, Math.min(hubR*Math.PI/params.innerCells, outerRingW/2.1));
            p.noStroke();
            p.fill(pR,pG,pB,40);p.circle(px,py,ballR*4);
            p.fill(pR,pG,pB,80);p.circle(px,py,ballR*2.8);
            p.fill(pR,pG,pB);p.circle(px,py,ballR*2);
            p.fill(255,255,255,160);p.circle(px-ballR*.28,py-ballR*.28,ballR*.7);
        }
    };

    p.rebuild=rebuild;
};
inst=new p5(sketch);

function setDiff(d){
    params.difficulty=d;
    ['easy','medium','hard'].forEach(x=>document.getElementById('diff-'+x).classList.toggle('active',x===d));
    resetPlayer();
}

// ── Disable pinch-zoom on iOS ──────────────────────────────────
document.addEventListener('gesturestart',  e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend',    e => e.preventDefault());
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});

function setThemeColor(c){document.getElementById('theme-color').setAttribute('content',c);}
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drawer-bg').classList.add('open');setThemeColor(BG);}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawer-bg').classList.remove('open');setThemeColor(BG);}

// ── Helpers ────────────────────────────────────────────────────
function hex3(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

// ── UI ─────────────────────────────────────────────────────────
function sp(k,v,l){params[k]=v;document.getElementById(l).textContent=v;inst.rebuild();}
function st(k,v){params[k]=v;inst.redraw();}

function applySeed(){const v=parseInt(document.getElementById('seed-input').value);if(v>0){params.seed=v;inst.rebuild();}}
function prevSeed(){params.seed=Math.max(1,params.seed-1);sync();inst.rebuild();}
function nextSeed(){params.seed++;sync();inst.rebuild();}
function rndSeed(){params.seed=Math.floor(Math.random()*999999)+1;sync();inst.rebuild();}
function sync(){document.getElementById('seed-input').value=params.seed;}
function resetAll(){
    params={...DEF};sync();
    document.getElementById('sl-rings').value=params.rings;document.getElementById('lv-rings').textContent=params.rings;
    document.getElementById('sl-inner').value=params.innerCells;document.getElementById('lv-inner').textContent=params.innerCells;
    document.getElementById('chk-sol').checked=params.showSolution;
    document.getElementById('chk-trail').checked=params.showTrail;

    ['easy','medium','hard'].forEach(x=>document.getElementById('diff-'+x).classList.toggle('active',x===params.difficulty));
    inst.rebuild();
}
</script>
